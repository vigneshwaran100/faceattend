[project]
name = "face-recognition"
version = "0.1.0"
description = "A modular python project for face recognition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "numpy>=1.24.0",
    "pydantic-settings>=2.0.0",
    "opencv-python>=5.0.0.93",
    "insightface>=1.0.1",
    "onnxruntime>=1.24.3",
    "pymilvus>=3.0.1",
    "sqlalchemy>=2.0.52",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.19.1",
    "apscheduler>=3.11.3",
    "pydantic[email]>=2.13.4",
    "python-multipart>=0.0.32",
    "pyjwt>=2.13.0",
    "bcrypt>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]


[project.scripts]
face-recognition-system = "app.main:main"
