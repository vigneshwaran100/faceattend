services:
  postgres:
    image: postgres:17
    container_name: smart-attendance-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: smart_attendance
      POSTGRES_USER: attendance_user
      POSTGRES_PASSWORD: attendance_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U attendance_user -d smart_attendance"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: smart-attendance-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin_password

    ports:
      - "5050:80"

    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: