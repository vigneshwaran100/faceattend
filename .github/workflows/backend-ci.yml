name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '.github/workflows/backend-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Pytest & Validation
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: test
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/test_db
      MILVUS_URI: http://localhost:19530
      MILVUS_COLLECTION_NAME: face_embeddings_v2
      JWT_SECRET: test-jwt-secret-key-that-is-at-least-32-characters-long
      JWT_ALGORITHM: HS256
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install system dependencies (OpenCV / GL dependencies)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Run Backend Pytest Suite
        run: uv run pytest -v
